<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة أقسام عماد الدين</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--red:#AE2328;--red-d:#8C1A1F;--tint:#FBEBEB;--line:#EBD3D4;--text:#2B1A1B;--muted:#80686A;--bg:#FFFFFF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--red);color:#fff;padding:14px 16px 14px;box-shadow:0 2px 0 var(--red-d)}
.bar .in{max-width:980px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:21px;font-weight:700}
.back{display:none;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer;text-decoration:none;align-items:center;justify-content:center}
.back.on{display:flex}
.sub{color:rgba(255,255,255,.85);font-size:13px;margin-top:3px}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 14px;border:2px solid transparent}
.search:focus-within{border-color:#FFD9DA}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:15px;padding:12px 0;outline:none;min-width:0}
.search svg{width:20px;height:20px;color:var(--red);flex:none}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{position:relative;aspect-ratio:1/1;border-radius:22px;padding:14px;color:var(--text);background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;font:inherit;text-align:right;cursor:pointer;overflow:hidden;transition:transform .12s,border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--red);box-shadow:0 6px 18px rgba(174,35,40,.12)}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.em{width:64px;height:64px;border-radius:20px;background:var(--tint);color:var(--red);display:grid;place-items:center}
.em svg{width:34px;height:34px}
.em.sm{width:44px;height:44px;border-radius:14px}.em.sm svg{width:24px;height:24px}
.tile b{font-size:16px;line-height:1.35;display:block}
.tile small{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.code{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.sec{aspect-ratio:1.1/1}
.sec .top{display:flex;align-items:center;justify-content:space-between}
.sec .num{font-size:22px;font-weight:700;color:var(--red);letter-spacing:.5px}
.main-code{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:20px;padding:14px 16px;margin-bottom:14px;border-right:6px solid var(--red)}
.main-code .em{background:#fff}
.main-code b{display:block;font-size:17px}
.main-code span.t{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red-d);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <div class="row"><a class="back" id="back" href="#" aria-label="رجوع">&#8594;</a>
  <div style="flex:1"><h1 id="ttl">شجرة أقسام عماد الدين</h1><div class="sub" id="sub"></div></div></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="ابحث باسم القسم أو الكود" autocomplete="off"></label>
</div></div>
<main><div id="view"></div></main>
<div id="toast" role="status"></div>
<script>
const G=[
[111,"منتجات ألبان","🥛",["العروض","ألبان معبأة","جبن معبأة","سمن وزبدة","زبادي وقشطة","رايب وزبادو","بيض","جبن مثلثات"]],
[112,"بقالة","🛒",["العروض","زيوت","زيت زيتون","أرز","نودلز ومكرونة","ملح"]],
[113,"معلبات","🥫",["العروض","تونة وأسماك معلبة","بولبيف ومعلبات لحوم","فول ومعلبات خضار","كمبوت ومعلبات فواكه","مخللات معبأة"]],
[114,"مستلزمات حلويات","🧁",["العروض","فانيليا وبيكنج بودر","خميرة","دقيق","جيلي وكريم كراميل","كيك وحلويات بودر","أيس كريم وكريم شانتيه","شيكولاتة خام"]],
[115,"إفطار","🍯",["العروض","حلاوة","مربى","عسل","كورن فليكس","طحينة","زبدة فول سوداني","شيكولاتة سبريد"]],
[116,"صلصة وصوصات","🍅",["العروض","صلصة","خل","صوصات حلويات","صوصات طعام","كاتشب ومايونيز","صوصات متنوعة"]],
[117,"مشروبات غازية ومياه","🥤",["العروض","مياه","مشروبات طاقة","مشروبات شعير","عصائر","عصائر مركزة","عصائر بودر","مشروبات مستوردة","قهوة مثلجة"]],
[118,"حلويات وتسالي","🍫",["العروض","بسكويت ومعمول","كيك","شيكولاتة","سناكس","شيبسي ومقرمشات","لبان","توفي وبونبون","كاندي"]],
[119,"مشروبات ساخنة","☕",["العروض","شاي","قهوة","أعشاب","كاكاو وسحلب","كابتشينو","نسكافيه"]],
[120,"دايت وصحي","🥗",["العروض","سكر دايت","شوفان ودقيق وحبوب","سناكس صحي","أطعمة لايت"]],
[121,"عطارة","🌿",["العروض","توابل معبأة","توابل وزن","بقوليات معبأة","بقوليات وزن","زيوت عطرية","بقسماط مطحون","بخور","خلطات ومرقات"]],
[122,"أيس كريم","🍦",[]],
[123,"منتجات أطفال","🍼",[]],
[124,"حيوانات أليفة","🐾",[]],
[125,"أطعمة مجمدة","❄️",["العروض","لحوم ودواجن","أسماك ومأكولات بحرية","خضار وفواكه مجمدة","بطاطس","معجنات وأطعمة مجمدة","موزاريلا"]],
[126,"جبن ولانشون ومخللات","🧀",["العروض","جبن بيضاء","أجبان فاخرة","مخلل وزيتون","جبن رومي","لانشون وبسطرمة","كيري وسلطات"]],
[127,"لحوم ودواجن وأسماك","🥩",["العروض","لحوم بلدي فريش","دواجن فريش","لحوم مستوردة","دواجن مجمدة","أسماك مملحة"]],
[128,"خضار وفاكهة","🥬",["العروض","خضار","فاكهة"]],
[129,"مخبوزات","🥖",["العروض","مخبوزات عماد الدين","مخبوزات شركات"]],
[130,"مكسرات وتمور","🥜",["العروض","مكسرات","تمور"]],
[131,"منتجات موسمية","🎉",["العروض","حلويات المولد","حلويات العيد","ياميش رمضان"]],
[132,"مستلزمات منزلية","🏠",["العروض","مستلزمات تنظيف","مستلزمات تغليف","بطاريات","مفرش سفرة","أكياس قمامة","أطباق ومعالق"]],
[133,"مناديل وحفاضات","🧻",["العروض","مناديل وجه","مناديل مطبخ","مناديل تواليت","مناديل مبللة","حفاضات"]],
[134,"منتجات الصحة والجمال","💄",["العروض","مستلزمات الوجه والجسم","مستلزمات استحمام","عطور ومزيلات","أدوات تجميلية","عناية الأطفال","فوط صحية"]],
[135,"منظفات","🧴",["العروض","عناية بالملابس","مطهرات","مزيلات وملمعات","مبيدات حشرية","منظفات أطباق","منظفات أحذية","معطرات جو"]],
[136,"خدمات","🚚",["خدمات دليفري","خدمات الشحن","بيع مخلفات"]]
];
const ICONS={
111:'<path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 7h10M9 13h6"/>',
112:'<path d="M3 9h18l-2 11H5z"/><path d="M8 9l3-5M16 9l-3-5"/>',
113:'<path d="M6 5c0-1.1 2.7-2 6-2s6 .9 6 2-2.7 2-6 2-6-.9-6-2z"/><path d="M6 5v14c0 1.1 2.7 2 6 2s6-.9 6-2V5M6 12c0 1.1 2.7 2 6 2s6-.9 6-2"/>',
114:'<path d="M5 11h14l-2 9H7z"/><path d="M6 11a6 6 0 0 1 12 0M12 3v2"/>',
115:'<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c-1 1 1 2 0 3M13 4c-1 1 1 2 0 3M8 21h8"/>',
116:'<path d="M10 3h4v3l2 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8.5 13h7"/>',
117:'<path d="M6 8h12l-1.5 13h-9z"/><path d="M12 8V3h4M6.5 13h11"/>',
118:'<circle cx="12" cy="12" r="4"/><path d="M8 12L3 9v6zM16 12l5-3v6z"/>',
119:'<path d="M5 8h11v7a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h2a2 2 0 0 1 0 5h-2M8 3v2M12 3v2"/>',
120:'<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15z"/><path d="M5 19l8-8"/>',
121:'<path d="M4 11h16l-2 8a2 2 0 0 1-2 1.5H8A2 2 0 0 1 6 19z"/><path d="M7 11l3-6M14 7h3"/>',
122:'<path d="M8 10a4 4 0 0 1 8 0z"/><path d="M8 10l4 11 4-11M12 4V3"/>',
123:'<path d="M10 3h4v3h-4z"/><path d="M9 6h6l1 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9z"/><path d="M8 13h8"/>',
124:'<path d="M12 14c-3 0-5 2-4 4s2 2 4 2 3 0 4-2-1-4-4-4z"/><circle cx="6.5" cy="11" r="1.6"/><circle cx="10" cy="7" r="1.6"/><circle cx="14" cy="7" r="1.6"/><circle cx="17.5" cy="11" r="1.6"/>',
125:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/>',
126:'<path d="M3 10l18-5v13H3z"/><path d="M8 14h.01M15 12h.01M12 16h.01"/>',
127:'<path d="M3 12c3-5 9-6 14-3l4-3v12l-4-3c-5 3-11 2-14-3z"/><path d="M8 11.5h.01"/>',
128:'<path d="M12 7c-3-2-8-1-8 5 0 5 3 9 5 9 1 0 2-.5 3-.5s2 .5 3 .5c2 0 5-4 5-9 0-6-5-7-8-5z"/><path d="M12 7c0-2 1-3 3-4"/>',
129:'<path d="M4 11c0-3 3-5 8-5s8 2 8 5v8H4z"/><path d="M9 11l2 3M13 11l2 3"/>',
130:'<path d="M12 3c4 3 6 7 6 11a6 6 0 0 1-12 0c0-4 2-8 6-11z"/><path d="M12 8v8"/>',
131:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
132:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10M10 20v-6h4v6"/>',
133:'<path d="M6 5h12v14H6z"/><path d="M6 5c0 2 2 3 6 3s6-1 6-3M10 13h4"/>',
134:'<path d="M9 21v-8h6v8z"/><path d="M10 13V8h4v5M10 8l4-5v5"/>',
135:'<path d="M9 11h6v10H9z"/><path d="M10 11V8h4v3M14 8l4-2M18 4v4"/>',
136:'<path d="M2 6h12v10H2z"/><path d="M14 9h4l4 3v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'
};
const ic=c=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[c]||"")+'</svg>';
const APP="شجرة أقسام عماد الدين";
const $=id=>document.getElementById(id),view=$("view"),q=$("q"),toast=$("toast");
let tt;
function say(m){toast.textContent=m;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),1800)}
function copy(code){try{navigator.clipboard.writeText(String(code)).then(()=>say("تم نسخ الكود "+code),()=>say("الكود "+code))}catch(e){say("الكود "+code)}}
const gTile=g=>'<a class="tile" href="#g'+g[0]+'"><span class="code">'+g[0]+'</span><span class="em">'+ic(g[0])+'</span><span><b>'+g[1]+'</b><small>'+(g[3].length?g[3].length+' قسم':'بدون أقسام فرعية')+'</small></span></a>';
const sTile=(g,s,k,showGroup)=>{const code=g[0]*100+k+1;return '<button class="tile sec" data-code="'+code+'"><span class="top"><span class="em sm">'+ic(g[0])+'</span><span class="num">'+code+'</span></span><span><b>'+s+'</b>'+(showGroup?'<small>'+g[1]+'</small>':'')+'</span></button>'};
function home(){
  $("back").classList.remove("on");$("ttl").textContent=APP;$("sub").textContent=G.length+" مجموعة - اختار مجموعة أو ابحث";
  view.innerHTML='<div class="grid">'+G.map(gTile).join("")+'</div>';
}
function group(code){
  const g=G.find(x=>x[0]===code);if(!g)return home();
  $("back").classList.add("on");$("ttl").textContent=g[1];$("sub").textContent=APP+" - كود "+g[0]+" - "+(g[3].length?g[3].length+" قسم فرعي":"بدون أقسام فرعية");
  view.innerHTML='<div class="main-code"><span class="em">'+ic(g[0])+'</span><div><b>'+g[1]+'</b><span class="t">الكود الفرعي الرئيسي '+g[0]+'00</span></div></div>'+
    (g[3].length?'<div class="grid">'+g[3].map((s,k)=>sTile(g,s,k,false)).join("")+'</div>':'<div class="empty">المجموعة دي ليس لها أقسام فرعية.</div>');
}
function search(t){
  $("back").classList.add("on");$("ttl").textContent="نتائج البحث";
  const n=t.trim();let gs=[],ss=[];
  G.forEach(g=>{
    if(g[1].includes(n)||String(g[0]).includes(n))gs.push(gTile(g));
    g[3].forEach((s,k)=>{const c=String(g[0]*100+k+1);if(s.includes(n)||c.includes(n))ss.push(sTile(g,s,k,true))});
  });
  $("sub").textContent=(gs.length+ss.length)+" نتيجة";
  view.innerHTML=(gs.length||ss.length)?'<div class="grid">'+gs.join("")+ss.join("")+'</div>':'<div class="empty">مفيش نتائج لـ "'+n.replace(/</g,"")+'"</div>';
}
function route(){
  if(q.value.trim()){search(q.value);return}
  const m=/^#g(\d{3})$/.exec(location.hash);m?group(+m[1]):home();
}
view.addEventListener("click",e=>{const b=e.target.closest("button[data-code]");if(b)copy(b.dataset.code)});
$("back").addEventListener("click",e=>{e.preventDefault();q.value="";if(location.hash)location.hash="";else route();scrollTo(0,0)});
q.addEventListener("input",route);
addEventListener("hashchange",()=>{q.value="";route();scrollTo(0,0)});
route();
</script>
</body>
</html>
